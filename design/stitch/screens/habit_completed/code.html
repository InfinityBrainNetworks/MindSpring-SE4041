<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
        .anim-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.5);
        }
        .anim-fade-up {
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            animation-delay: 0.3s;
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .sparkle-1 { animation: float 3s ease-in-out infinite alternate; }
        .sparkle-2 { animation: float 4s ease-in-out infinite alternate-reverse; }
        .sparkle-3 { animation: float 2.5s ease-in-out infinite alternate; }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">

<div class="absolute inset-0 pointer-events-none overflow-hidden flex items-center justify-center">
<div class="w-[150vw] h-[150vw] md:w-[60vw] md:h-[60vw] bg-surface-container-low rounded-full blur-[100px] opacity-70 absolute top-[-10%] left-[-20%]"></div>
<div class="w-[100vw] h-[100vw] md:w-[40vw] md:h-[40vw] bg-inverse-primary/20 rounded-full blur-[80px] absolute bottom-[10%] right-[-10%]"></div>

</div>
<!-- TopAppBar -->

<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden flex-shrink-0">

<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-16 pb-20 px-screen_padding relative z-10 w-full max-w-lg mx-auto text-center h-full">
<!-- Celebration Graphic -->
<div class="relative mb-stack_lg anim-pop mt-12">
<!-- Sparkles -->
<div class="absolute -top-8 -left-8 text-secondary sparkle-1">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="absolute top-4 -right-10 text-primary-container sparkle-2">
<span class="material-symbols-outlined text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="absolute -bottom-6 left-2 text-secondary-container sparkle-3">
<span class="material-symbols-outlined text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
<!-- Central Icon -->
<div class="w-48 h-48 rounded-full bg-white shadow-[0px_8px_30px_rgba(27,36,34,0.12)] flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary-fixed opacity-20"></div>
<!-- Completed Habit Icon (e.g., Book) fading into Checkmark -->
<div class="relative w-24 h-24 flex items-center justify-center text-primary-container z-10">
<span class="material-symbols-outlined text-6xl absolute transition-all duration-500 opacity-0 scale-50" data-icon="menu_book">menu_book</span>
<span class="material-symbols-outlined text-[80px] text-primary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>

</div>

<p class="font-body-md text-body-md text-on-surface-variant mb-stack_lg">You're one step closer to your goal. Consistency is the key to lasting vitality.</p>
