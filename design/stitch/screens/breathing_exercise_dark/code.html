<style>
        body {
            background-color: #101816; /* Custom background as requested */
            color: #e9f3ef; /* Light text for dark bg */
        }
        
        .breath-ring {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px solid rgba(46, 125, 116, 0.3); /* Teal #2E7D74 */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .breath-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: rgba(46, 125, 116, 0.2);
            box-shadow: 0 0 40px rgba(46, 125, 116, 0.4);
            animation: breathe 16s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.6; }
            25% { transform: scale(1.6); opacity: 1; } /* Inhale */
            50% { transform: scale(1.6); opacity: 1; } /* Hold */
            75% { transform: scale(1); opacity: 0.6; } /* Exhale */
            100% { transform: scale(1); opacity: 0.6; } /* Hold */
        }

        .instruction-text {
            animation: textBreathe 16s infinite;
        }

        @keyframes textBreathe {
            0%, 15% { content: "Inhale"; opacity: 1; }
            20%, 45% { content: "Hold"; opacity: 1; }
            50%, 70% { content: "Exhale"; opacity: 1; }
            75%, 95% { content: "Hold"; opacity: 1; }
            100% { content: "Inhale"; opacity: 1; }
        }

    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md">
<!-- Top Action Area (Close/Back) -->
<div class="absolute top-0 left-0 w-full px-screen_padding py-stack_lg flex justify-between items-center z-20">
<button class="p-2 rounded-full hover:bg-white/10 transition-colors flex items-center justify-center text-[#e9f3ef]">
<span class="material-symbols-outlined text-title-md" data-icon="close">close</span>
</button>
<button class="p-2 rounded-full hover:bg-white/10 transition-colors flex items-center justify-center text-[#e9f3ef]">
<span class="material-symbols-outlined text-title-md" data-icon="more_horiz">more_horiz</span>
</button>
</div>
<!-- Main Content -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center z-10 px-screen_padding space-y-stack_lg">
<div class="text-center space-y-stack_md">
<h1 class="font-display-lg text-display-lg text-[#e9f3ef] tracking-tight">Box Breathing</h1>
<p class="text-gray-400 font-body-md text-body-md">4-4-4-4 technique for focus</p>
</div>
<div class="relative py-12">
<div class="breath-ring">
<div class="breath-circle"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-white font-title-md text-title-md font-semibold tracking-wider z-10" id="breathInstruction">Breathe</span>
</div>
</div>
</div>
<!-- Controls -->
<div class="flex items-center gap-gutter pt-8">
<button class="w-16 h-16 rounded-full border border-white/20 flex items-center justify-center hover:bg-white/10 transition-colors text-white">
<span class="material-symbols-outlined" data-icon="replay">replay</span>
</button>
<button class="w-20 h-20 rounded-full bg-[#2E7D74] flex items-center justify-center hover:bg-[#25635c] transition-colors text-white shadow-lg shadow-[#2E7D74]/20">
<span class="material-symbols-outlined text-display-lg" data-icon="pause">pause</span>
</button>
<button class="w-16 h-16 rounded-full border border-white/20 flex items-center justify-center hover:bg-white/10 transition-colors text-white">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</main>
<!-- Navigation suppressed due to linear/focused intent rule -->
<script>
        // Simple text cycler to match animation
        const instructions = ["Inhale...", "Hold", "Exhale...", "Hold"];
        const element = document.getElementById('breathInstruction');
        let index = 0;
        
        setInterval(() => {
            index = (index + 1) % 4;
            element.innerText = instructions[index];
            // Fade effect could be added here for smoother transitions
        }, 4000); // 4 seconds per phase
    </script>
</body></html>
