<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MindSpring - Mood Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {

            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface": "#141d1b",
                        "surface": "#f2fcf8",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#e9f3ef",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#dbe5e1",
                        "on-tertiary-fixed-variant": "#444844",
                        "surface-dim": "#d2dcd9",
                        "secondary-container": "#feb64e",
                        "inverse-surface": "#293230",
                        "on-tertiary": "#ffffff",

                        "tertiary-container": "#464946",
                        "on-surface-variant": "#404947",
                        "error": "#ba1a1a",
                        "tertiary": "#2f3330",
                        "on-background": "#141d1b",
                        "outline-variant": "#bfc8c6",
                        "on-tertiary-container": "#b5b8b3",
                        "on-tertiary-fixed": "#191c1a",
                        "outline": "#707977",
                        "primary-fixed": "#b2eee7",
                        "on-error": "#ffffff",

                        "secondary-fixed-dim": "#ffb956",
                        "on-secondary-container": "#714800",
                        "on-primary-fixed-variant": "#0d4f4a",
                        "surface-container": "#e6f0ec",
                        "on-primary-fixed": "#00201d",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f2fcf8",
                        "secondary-fixed": "#ffddb5",
                        "primary": "#003935",
                        "tertiary-fixed-dim": "#c5c7c3",
                        "tertiary-fixed": "#e1e3de",
                        "primary-fixed-dim": "#97d1ca",
                        "surface-variant": "#dbe5e1",
                        "primary-container": "#10514c",
                        "on-secondary-fixed": "#2a1800",
                        "background": "#f2fcf8",
                        "on-secondary-fixed-variant": "#643f00",
                        "surface-tint": "#2d6862",
                        "surface-container-low": "#ecf6f2",
                        "on-primary-container": "#88c2bb",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "stack_md": "16px",
                        "stack_lg": "32px",
                        "gutter": "16px",
                        "base": "8px",
                        "stack_sm": "8px",
                        "card_padding": "20px",
                        "screen_padding": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]

                    "animation": {

                        "spin": "spin 1s linear infinite"
                    },
                    "keyframes": {
                        "slideUpFade": {
                            "0%": { opacity: 0, transform: "translateY(20px)" },
                            "100%": { opacity: 1, transform: "translateY(0)" }
                        },
                        "pop": {
                            "0%": { transform: "scale(1)" },
                            "50%": { transform: "scale(1.1)" },
                            "100%": { transform: "scale(1)" }
                        }
                    }
                }
            }
        }
    </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
        body {
            background-color: #F4F6F1; /* Pale sage background */
            position: relative;
        }
        
        #glcanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.3;
            pointer-events: none;
        }
        
        .shadow-soft {
            box-shadow: 0px 4px 20px rgba(27, 36, 34, 0.06);
        }
        
        .mood-container.has-selection .mood-btn:not(.selected) {
            opacity: 0.5;
            transform: scale(0.9);
        }

        .mood-btn.selected {
            transform: scale(1.2) !important;
        }
        
        /* Mood Colors & Glows */
        .mood-1.selected { background-color: #ba1a1a; color: white; box-shadow: 0 0 15px rgba(186, 26, 26, 0.4); } /* Error red */
        .mood-2.selected { background-color: #E28C65; color: white; box-shadow: 0 0 15px rgba(226, 140, 101, 0.4); } 
        .mood-3.selected { background-color: #feb64e; color: #141d1b; box-shadow: 0 0 15px rgba(254, 182, 78, 0.4); } /* Secondary Container */
        .mood-4.selected { background-color: #88c2bb; color: #141d1b; box-shadow: 0 0 15px rgba(136, 194, 187, 0.4); } /* On Primary Container */
        .mood-5.selected { background-color: #10514C; color: white; box-shadow: 0 0 15px rgba(16, 81, 76, 0.4); } /* Primary Container */
        
        .emotion-chip.selected {
            background-color: #10514C; /* Primary Teal */
            color: #ffffff;
            border-color: #10514C;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .stagger-1 { opacity: 0; animation-delay: 0.1s; }
        .stagger-2 { opacity: 0; animation-delay: 0.2s; }
        .stagger-3 { opacity: 0; animation-delay: 0.3s; }
        .stagger-4 { opacity: 0; animation-delay: 0.4s; }
        
        .loader {
            border: 2px solid rgba(20, 29, 27, 0.3);
            border-top: 2px solid #141d1b;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-on-surface min-h-screen flex flex-col">
<canvas id="glcanvas"></canvas>
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-screen_padding py-base bg-surface-container-lowest/80 backdrop-blur-md shadow-soft z-10 sticky top-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">Mood Check-in</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-screen_padding py-stack_lg flex flex-col gap-stack_lg max-w-2xl mx-auto w-full relative z-10">
<!-- Mood Selector Section -->
<section class="bg-surface-container-lowest rounded-[20px] p-card_padding shadow-soft flex flex-col items-center gap-stack_md animate-slide-up-fade stagger-1">
<h2 class="font-display-lg text-display-lg text-on-surface text-center">How was your day?</h2>
<div class="flex justify-between items-center w-full max-w-sm mt-4 gap-2 mood-container" id="mood-selector">
<button class="mood-btn mood-1 w-14 h-14 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant transition-all duration-300 hover:scale-105" data-mood="1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_very_dissatisfied</span>
</button>
<button class="mood-btn mood-2 w-14 h-14 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant transition-all duration-300 hover:scale-105" data-mood="2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</button>
<button class="mood-btn mood-3 w-14 h-14 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant transition-all duration-300 hover:scale-105" data-mood="3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
</button>
<button class="mood-btn mood-4 w-14 h-14 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant transition-all duration-300 hover:scale-105" data-mood="4">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
</button>
<button class="mood-btn mood-5 w-14 h-14 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant transition-all duration-300 hover:scale-105" data-mood="5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</button>
</div>
</section>
<!-- Emotion Chips Section -->
<section class="bg-surface-container-lowest rounded-[20px] p-card_padding shadow-soft flex flex-col gap-stack_md animate-slide-up-fade stagger-2">
<h3 class="font-title-md text-title-md text-on-surface">What feelings stood out?</h3>
<div class="flex flex-wrap gap-3" id="emotion-chips">
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Calm</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Anxious</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Tired</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Motivated</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Stressed</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Grateful</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Lonely</button>
<button class="emotion-chip px-4 py-2 rounded-full border border-primary-container text-primary-container font-body-md text-body-md transition-all duration-200 hover:bg-surface-variant">Focused</button>
</div>
</section>
<!-- Note Text Area -->
<section class="bg-surface-container-lowest rounded-[20px] p-card_padding shadow-soft flex flex-col gap-stack_md animate-slide-up-fade stagger-3">
<label class="font-title-md text-title-md text-on-surface" for="mood-note">Add a note (optional)</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-transparent p-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-on-surface-variant/50 transition-colors" id="mood-note" placeholder="Jot down some thoughts about today..." rows="4"></textarea>
</section>
<!-- Spacer to push button down if needed -->
<div class="flex-grow"></div>
<!-- Save Button -->
<button class="w-full py-4 rounded-full bg-secondary-container text-[#141d1b] font-title-md text-title-md shadow-[0px_8px_30px_rgba(27,36,34,0.12)] transition-transform hover:scale-[0.98] active:scale-95 flex justify-center items-center gap-2 mb-stack_lg animate-slide-up-fade stagger-4" id="save-btn">
<span class="btn-text">Save Entry</span>
<span class="material-symbols-outlined btn-icon">check</span>
<div class="loader hidden"></div>
</button>
</main>
<script>
        // Mood Selector Logic
        const moodContainer = document.getElementById('mood-selector');
        const moodBtns = document.querySelectorAll('.mood-btn');
        
        moodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                moodContainer.classList.add('has-selection');
                moodBtns.forEach(b => {
                    b.classList.remove('selected', 'ring-2');
                    b.querySelector('span').style.color = ''; // Reset icon color
                });
                btn.classList.add('selected');
            });
        });

        // Emotion Chips Logic
        const chips = document.querySelectorAll('.emotion-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                // Remove animation class before re-adding to allow multiple pops
                chip.classList.remove('selected');
                void chip.offsetWidth; // trigger reflow
                chip.classList.add('selected');
            });
        });

        // Save Button Logic
        const saveBtn = document.getElementById('save-btn');
        const btnText = saveBtn.querySelector('.btn-text');
        const btnIcon = saveBtn.querySelector('.btn-icon');
        const loader = saveBtn.querySelector('.loader');

        saveBtn.addEventListener('click', () => {
            if(saveBtn.classList.contains('loading')) return;
            
            // Set loading state
            saveBtn.classList.add('loading');
            btnText.textContent = 'Saving...';
            btnIcon.classList.add('hidden');
            loader.classList.remove('hidden');
            
            // Simulate API call
            setTimeout(() => {
                // Success state
                btnText.textContent = 'Saved!';
                loader.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                
                // Reset after delay
                setTimeout(() => {
                    saveBtn.classList.remove('loading');
                    btnText.textContent = 'Save Entry';
                }, 2000);
            }, 1200);
        });

        // Shader Setup
        const vertexShader = `
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;
            varying vec2 v_texCoord;
            uniform float u_time;
            uniform vec2 u_resolution;

            void main() {
                vec2 uv = v_texCoord;
                
                // Create a slow-moving, organic gradient
                vec3 color1 = vec3(0.06, 0.32, 0.30); // Deep Teal #10514C
                vec3 color2 = vec3(0.96, 0.96, 0.95); // Pale Sage #F4F6F1
                
                float noise = sin(uv.x * 3.0 + u_time * 0.5) * cos(uv.y * 3.0 + u_time * 0.4);
                noise += sin(uv.x * 5.0 - u_time * 0.3) * cos(uv.y * 2.0 + u_time * 0.2);
                
                float mixFactor = clamp(noise * 0.5 + 0.5, 0.0, 1.0);
                vec3 color = mix(color1, color2, mixFactor * 0.2 + 0.1); // Keep it subtle
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const scene = new THREE.Scene();

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2() }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function resize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', resize);
        resize();

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body></html>
