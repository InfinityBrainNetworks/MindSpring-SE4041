<style>
        .breathing-circle {
            animation: breathe 8s ease-in-out infinite;
        }
        
        .pulse-ring-1 { animation: pulse 8s ease-in-out infinite 0.2s; }
        .pulse-ring-2 { animation: pulse 8s ease-in-out infinite 0.4s; }
        .pulse-ring-3 { animation: pulse 8s ease-in-out infinite 0.6s; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.6); opacity: 0.3; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full bg-primary-container font-body-md text-inverse-on-surface flex flex-col items-center justify-between p-screen_padding overflow-hidden relative">
<!-- Top Navigation / Dismiss -->
<header class="w-full flex justify-between items-center z-10 py-base">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-lowest/10 hover:bg-surface-container-lowest/20 transition-colors backdrop-blur-sm">
<span class="material-symbols-outlined text-inverse-on-surface" data-icon="close">close</span>
</button>
<div class="flex gap-2">
<!-- Chips for duration -->
<button class="px-4 py-2 rounded-full border border-inverse-on-surface/30 text-inverse-on-surface font-label-sm text-label-sm hover:bg-surface-container-lowest/10 transition-colors">1 min</button>
<button class="px-4 py-2 rounded-full bg-surface-container-lowest/20 text-inverse-on-surface font-label-sm text-label-sm border border-transparent backdrop-blur-sm">3 min</button>
<button class="px-4 py-2 rounded-full border border-inverse-on-surface/30 text-inverse-on-surface font-label-sm text-label-sm hover:bg-surface-container-lowest/10 transition-colors">5 min</button>
</div>
</header>
<!-- Central Breathing Animation Area -->
<main class="flex-1 flex flex-col items-center justify-center w-full z-10 relative">
<h1 class="font-display-lg text-display-lg text-inverse-on-surface mb-stack_lg z-20 text-center tracking-wide" id="instruction-text">Breathe in</h1>
<!-- Concentric Circles Animation -->
<div class="relative w-64 h-64 flex items-center justify-center my-stack_lg">
<!-- Outer rings -->
<div class="absolute w-full h-full rounded-full border border-secondary-container/20 pulse-ring-3"></div>
<div class="absolute w-48 h-48 rounded-full border border-secondary-container/40 pulse-ring-2"></div>
<div class="absolute w-32 h-32 rounded-full border border-secondary-container/60 pulse-ring-1"></div>
<!-- Central solid circle -->
<div class="w-24 h-24 rounded-full bg-secondary-container breathing-circle shadow-[0_0_40px_rgba(254,182,78,0.4)] flex items-center justify-center">
<!-- Optional center icon -->
<span class="material-symbols-outlined text-on-secondary-container opacity-50" data-icon="self_improvement">self_improvement</span>
</div>
</div>
<div class="font-title-md text-title-md text-inverse-on-surface mt-stack_lg z-20" id="countdown-timer">
            0:45
        </div>
</main>
<!-- Bottom Action -->
<footer class="w-full flex justify-center z-10 pb-stack_md">
<button class="px-8 py-3 rounded-full border border-inverse-on-surface/40 text-inverse-on-surface font-title-md text-title-md hover:bg-inverse-on-surface/10 transition-colors">
            End session
        </button>
</footer>
<!-- Background Ambient Element (Optional subtle texture/gradient) -->
<div class="absolute inset-0 bg-gradient-to-b from-primary-container via-[#0d403c] to-[#0a312e] -z-10"></div>
<script>
        // Simple logic to swap text to simulate breathing instructions
        const instructions = ["Breathe in...", "Hold...", "Breathe out...", "Hold..."];
        let phase = 0;
        const textElement = document.getElementById('instruction-text');
        
        setInterval(() => {
            phase = (phase + 1) % 4;
            textElement.style.opacity = 0;
            setTimeout(() => {
                textElement.innerText = instructions[phase];
                textElement.style.opacity = 1;
            }, 300); // Wait for fade out
        }, 4000); // Change roughly sync'd with animation
    </script>
</body></html>
