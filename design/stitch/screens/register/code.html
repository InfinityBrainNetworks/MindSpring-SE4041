<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - MindSpring</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface": "#141d1b",
                        "surface": "#f2fcf8",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#e9f3ef",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#dbe5e1",
                        "on-tertiary-fixed-variant": "#444844",
                        "surface-dim": "#d2dcd9",
                        "secondary-container": "#feb64e",
                        "inverse-surface": "#293230",
                        "on-tertiary": "#ffffff",
                        "surface-container-high": "#e0eae7",
                        "tertiary-container": "#464946",
                        "on-surface-variant": "#404947",
                        "error": "#ba1a1a",
                        "tertiary": "#2f3330",
                        "on-background": "#141d1b",
                        "outline-variant": "#bfc8c6",
                        "on-tertiary-container": "#b5b8b3",
                        "on-tertiary-fixed": "#191c1a",
                        "outline": "#707977",
                        "primary-fixed": "#b2eee7",
                        "on-error": "#ffffff",
                        "inverse-primary": "#97d1ca",
                        "secondary-fixed-dim": "#ffb956",
                        "on-secondary-container": "#714800",
                        "on-primary-fixed-variant": "#0d4f4a",
                        "surface-container": "#e6f0ec",
                        "on-primary-fixed": "#00201d",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f2fcf8",
                        "secondary-fixed": "#ffddb5",
                        "primary": "#003935",
                        "tertiary-fixed-dim": "#c5c7c3",
                        "tertiary-fixed": "#e1e3de",
                        "primary-fixed-dim": "#97d1ca",
                        "surface-variant": "#dbe5e1",
                        "primary-container": "#10514c",
                        "on-secondary-fixed": "#2a1800",
                        "background": "#f2fcf8",
                        "on-secondary-fixed-variant": "#643f00",
                        "surface-tint": "#2d6862",
                        "surface-container-low": "#ecf6f2",
                        "on-primary-container": "#88c2bb",
                        "secondary": "#835400"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_md": "16px",
                        "stack_lg": "32px",
                        "gutter": "16px",
                        "base": "8px",
                        "stack_sm": "8px",
                        "card_padding": "20px",
                        "screen_padding": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]

                }
            }
        }

<style>
        body {
            background-color: #F4F6F1; /* Pale sage background */
        }
        
        /* Custom Input Styles based on Style Guidance */
        .input-field {
            border-radius: 8px;
            border-color: rgba(92, 107, 103, 0.4); /* Secondary Text at 40% */
            background-color: transparent;
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus {
            border-color: #10514c; /* Primary Teal */
            border-width: 2px;
            box-shadow: none;
            outline: none;
        }
        
        .floating-label {
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        
        .input-group:focus-within .floating-label,
        .input-field:not(:placeholder-shown) + .floating-label {
            transform: translateY(-120%) scale(0.85);
            color: #10514c;
        }

        .btn-primary {
            background-color: #E8A33D; /* Warm Amber */
            color: #1a1a1a; /* Deep Charcoal */
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        
        .checkbox-custom {
            accent-color: #10514c;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-screen_padding">
<!-- Top AppBar (Back Navigation) - Implicitly derived, suppressing shell for transactional screen -->
<header class="fixed top-0 left-0 w-full p-screen_padding z-10 flex items-center">
<a class="inline-flex items-center justify-center p-2 rounded-full hover:bg-black/5 transition-colors" href="#">
<span class="material-symbols-outlined text-primary-container" data-icon="arrow_back">arrow_back</span>
</a>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto pt-16">
<!-- Header Section -->
<div class="mb-stack_lg text-center">
<h1 class="font-display-lg text-display-lg text-primary-container mb-stack_sm">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join MindSpring and start your journey.</p>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-[20px] p-card_padding shadow-[0px_4px_20px_rgba(27,36,34,0.06)] relative overflow-hidden group">
<form action="#" class="flex flex-col gap-stack_md relative z-10" method="POST">
<!-- Name Field -->
<div class="relative input-group mt-2">
<input class="input-field w-full px-4 py-3 font-body-md text-on-surface placeholder-transparent" id="name" name="name" placeholder=" " required="" type="text"/>
<label class="floating-label absolute left-4 top-3 font-body-md text-outline" for="name">Full Name</label>
</div>
<!-- Email Field -->
<div class="relative input-group mt-2">
<input class="input-field w-full px-4 py-3 font-body-md text-on-surface placeholder-transparent" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="floating-label absolute left-4 top-3 font-body-md text-outline" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="relative input-group mt-2">
<input class="input-field w-full px-4 py-3 font-body-md text-on-surface placeholder-transparent" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-4 top-3 font-body-md text-outline" for="password">Password</label>
</div>
<!-- Confirm Password Field -->
<div class="relative input-group mt-2 mb-2">
<input class="input-field w-full px-4 py-3 font-body-md text-on-surface placeholder-transparent" id="confirm_password" name="confirm_password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-4 top-3 font-body-md text-outline" for="confirm_password">Confirm Password</label>
</div>
<!-- Privacy Checkbox -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input class="checkbox-custom w-5 h-5 rounded border-outline-variant focus:ring-primary-container focus:ring-2" id="privacy" name="privacy" required="" type="checkbox"/>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant leading-tight cursor-pointer" for="privacy">
                        I agree to the privacy policy. <br/>
<span class="text-primary-container font-semibold">Note: All your data stays on this device.</span>
</label>
</div>
<!-- Submit Button -->
<button class="btn-primary w-full py-4 rounded-full font-title-md text-title-md mt-stack_md shadow-[0px_8px_30px_rgba(27,36,34,0.12)] transform transition-transform active:scale-95" type="submit">
                    Create Account
                </button>
</form>
<!-- Decorative atmospheric element -->
<div class="absolute -bottom-20 -right-20 w-40 h-40 bg-primary-fixed/20 rounded-full blur-3xl pointer-events-none transition-all duration-1000 group-hover:bg-primary-fixed/30"></div>
</div>
<!-- Footer Link -->
<div class="mt-stack_lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary-container font-bold hover:underline decoration-2 underline-offset-4" href="#">Sign In</a>
</p>
</div>
</main>
</body></html>
