<script>
        // Simple vanilla JS to handle scroll snapping and indicator updates
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = document.getElementById('carousel');
            const indicators = document.querySelectorAll('.indicator-dot');
            
            if(!carousel || indicators.length === 0) return;

            const updateIndicators = () => {
                const scrollLeft = carousel.scrollLeft;
                const slideWidth = carousel.clientWidth;
                // Calculate current slide index based on scroll position
                const currentIndex = Math.round(scrollLeft / slideWidth);
                
                indicators.forEach((dot, index) => {
                    if(index === currentIndex) {
                        dot.classList.remove('bg-outline-variant');
                        dot.classList.add('bg-secondary-container');
                        dot.classList.add('w-6'); // Make active dot wider
                    } else {
                        dot.classList.remove('bg-secondary-container', 'w-6');
                        dot.classList.add('bg-outline-variant');
                    }
                });
            };

            // Listen for scroll events on the carousel
            carousel.addEventListener('scroll', () => {
                // Throttle the update slightly for performance
                requestAnimationFrame(updateIndicators);
            });
            
            // Allow clicking indicators to scroll
            indicators.forEach(dot => {
                dot.addEventListener('click', (e) => {
                    const index = parseInt(e.target.getAttribute('data-index'));
                    const slideWidth = carousel.clientWidth;
                    carousel.scrollTo({
                        left: slideWidth * index,
                        behavior: 'smooth'
                    });
                });
            });
        });
    </script>
