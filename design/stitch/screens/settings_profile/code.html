<style>
        body {
            background-color: #F4F6F1; /* Pale sage background override to match spec */
            color: #141d1b; /* on-surface */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom soft shadows */
        .shadow-level-1 {
            box-shadow: 0px 4px 20px rgba(27, 36, 34, 0.06);
        }
        
        /* Toggle Switch Customization */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10514C; /* primary-container */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10514C; /* primary-container */
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e2e8f0;
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #cbd5e1;
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle-label::after {
            content: '';
            position: absolute;
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-checkbox:checked + .toggle-label::after {
            transform: translateX(1.5rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="font-body-md text-body-md min-h-screen flex flex-col items-center pb-24">

<div class="relative mb-4">
<div class="w-24 h-24 rounded-full overflow-hidden shadow-level-1 border-4 border-surface-container-lowest">

</div>
<button aria-label="Edit Avatar" class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container rounded-full w-8 h-8 flex items-center justify-center shadow-md hover:bg-surface-tint transition-colors">
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
<h2 class="font-title-md text-title-md text-on-surface">Asan</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Member since Aug 2026</p>
</section>
<!-- Settings Group -->
<section class="flex flex-col gap-base">

</div>

</button>
<div class="h-[1px] w-full bg-surface-variant mx-4 w-[calc(100%-32px)]"></div>

<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">

<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer" for="toggle"></label>

</div>
<div class="h-[1px] w-full bg-surface-variant mx-4 w-[calc(100%-32px)]"></div>

</div>

</button>
<div class="h-[1px] w-full bg-surface-variant mx-4 w-[calc(100%-32px)]"></div>
<!-- About -->
<button class="w-full px-card_padding py-4 flex items-center justify-between hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">

</div>

</div>
</section>

</section>

<p class="font-label-sm text-label-sm text-center text-on-surface-variant mt-stack_lg px-4 opacity-80">
            MindSpring is a self-reflection tool and not medical advice.

<span class="font-label-sm text-label-sm">Profile</span>

<script>
        // Simple script to handle visual states for touch/active elements
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('scale-[0.98]'));
            btn.addEventListener('touchend', () => btn.classList.remove('scale-[0.98]'));
        });
    </script>
